[project]
name = "gexbot-backend"
version = "0.1.0"
description = "Self-hosted GEX proxy bot backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=0.28.0",
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"
